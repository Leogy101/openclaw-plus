function projectsPage(){return `<div class="page-intro"><div><h2>A place for every thread</h2><p>Projects organize your work without recreating your agents.</p></div></div><div class="card-grid">${['Sample workspace','Research'].map((n,i)=>`<article class="card"><div class="row">${icon('folder')}<h3>${n}</h3></div><p>Demo host · /demo/${i?'research':'sample-workspace'}<br>${i?'Research notes and interface references.':'Conversations, files and workspace changes.'}</p>${btn('session','Open conversation '+icon('arrow'),'button',`data-session="${i?'builder-two':'coordinator'}"`)}${btn('file','Browse sample files','text-btn')}</article>`).join('')}</div>`}
function automationsPage(){return `<div class="page-intro"><div><h2>Quietly, in the background</h2><p>Fictional schedules and their simulated execution history.</p></div>${pill('Demo schedules')}</div><div class="list">${btn('automation',icon('clock')+'<span class="grow"><strong>Workspace index</strong><span>Every day · 9:00 AM · Etc/UTC</span></span>'+pill('Running','green')+icon('arrow'),'list-row')}${btn('automation',icon('clock')+'<span class="grow"><strong>Weekly review</strong><span>Friday · 4:00 PM · Etc/UTC</span></span>'+pill('Scheduled')+icon('arrow'),'list-row')}</div><p class="panel-note">A schedule and its current execution have separate states. This preview never creates or triggers a job.</p>`}
function morePage(){return `<div class="page-intro"><div><h2>Everything else, within reach</h2><p>Advanced capabilities stay organized and searchable.</p></div></div><div class="category-grid">${categories.map((c,i)=>btn('capability',icon(['settings','bolt','folder','link','chat','agents','file','activity','globe','chat','terminal','shield'][i%12])+esc(c),'category-card',`data-capability="${esc(c)}"`)).join('')}</div><p class="panel-note">These are discoverability previews. Original-interface destinations are described without opening a live connection.</p>`}
function render(){const overlayActive=document.activeElement?.closest('#overlay')?{id:document.activeElement.id,action:document.activeElement.dataset.action,value:document.activeElement.value,start:document.activeElement.selectionStart,end:document.activeElement.selectionEnd}:null;const focused=document.activeElement?.id,sel=focused==='composer'?[document.activeElement.selectionStart,document.activeElement.selectionEnd]:null,scroll=document.getElementById('transcript')?.scrollTop||0,workScroll=document.getElementById('work-scroll')?.scrollTop||0;state.renderCount++;document.body.classList.toggle('nav-hidden',state.navHidden&&viewWidth()>=1000);document.getElementById('app').innerHTML=`<div class="titlebar"><div class="row"><span class="traffic" aria-hidden="true"><i></i><i></i><i></i></span>${btn('toggle-nav',icon('sidebar'),'icon-btn','aria-label="Toggle navigation"')}<span class="wordmark">OpenClaw<span class="brand-plus">+</span></span></div><span class="top-center">Demo host <span style="padding:0 8px;opacity:.6">/</span> Sample workspace</span><div class="row">${btn('demo','Prototype','prototype','aria-label="Open prototype review controls"')}${btn('search',icon('search')+'<span class="small wide-only">⌘ K</span>','button','aria-label="Quick Open"')}${btn('theme',icon(state.theme==='dark'?'sun':'moon'),'icon-btn',`aria-label="Switch to ${state.theme==='dark'?'light':'dark'} theme"`)}</div></div><div class="shell">${navHTML()}<main class="content">${headerHTML()}${!state.online?`<div class="notice" id="offline-description" role="status">${icon('alert')}<span>Disconnected. Conversations and work are shown from the last observation.</span>${btn('reconnect','Reconnect demo','text-btn')}</div>`:''}<div class="workspace ${!state.panel?'no-panel':''}">${state.page==='Conversations'?chatHTML():`<section class="full-page">${state.page==='Agents'?agentPage():state.page==='Activity'?activityPage():state.page==='Projects'?projectsPage():state.page==='Automations'?automationsPage():morePage()}</section>`}${state.panel?`${viewWidth()<1280?btn('toggle-panel','','sheet-scrim','aria-label="Dismiss Work sheet"'):''}${panelHTML()}`:''}</div></main></div>`;document.getElementById('transcript')?.scrollTo(0,scroll);document.getElementById('work-scroll')?.scrollTo(0,workScroll);if(focused==='composer'){const el=document.getElementById('composer');el?.focus({preventScroll:true});if(sel)el?.setSelectionRange(...sel)}if(state.modal){renderModal();if(overlayActive){const next=overlayActive.id?document.getElementById(overlayActive.id):document.querySelector('#overlay [data-action="'+overlayActive.action+'"]');if(next){if(overlayActive.value!==undefined)next.value=overlayActive.value;next.focus({preventScroll:true});if(overlayActive.start!=null&&next.setSelectionRange)next.setSelectionRange(overlayActive.start,overlayActive.end)}}}syncSheet();}
function syncSheet(){const sheet=state.panel&&viewWidth()<1280,panel=document.querySelector('.work-panel');if(panel){if(sheet){panel.setAttribute('role','dialog');panel.setAttribute('aria-modal','true')}else{panel.removeAttribute('role');panel.removeAttribute('aria-modal')}}document.querySelectorAll('.titlebar,.nav,.page-header,.main,.full-page').forEach(el=>el.inert=sheet);if(sheet&&!state.modal&&!panel.contains(document.activeElement))panel.querySelector('button')?.focus({preventScroll:true})}
function saveOrigin(){return {session:state.session,page:state.page,scroll:document.getElementById('transcript')?.scrollTop||0,workScroll:document.getElementById('work-scroll')?.scrollTop||0,panel:state.panel,pin:state.pin,scope:state.scope,tab:state.panelTab,detail:state.detail,expanded:state.expanded,workContext:state.workContext,focusId:document.activeElement?.id||null,focusSession:document.activeElement?.dataset?.session||null}}
function openSession(id,child=false){if(!sessions[id])return showModal('unavailable',{reason:'Session identity is unavailable. No substitute conversation was opened.'});if(child&&id==='builder'&&['missing-session','replaced-session','revoked'].includes(state.scenario)){return showModal('unavailable',{reason:state.scenario==='revoked'?'Access to this delegated session was revoked.':state.scenario==='replaced-session'?'This session was replaced after the work row was observed. Its replacement was not opened.':'This work record has no exact session identity. Choose another known session or refresh the fixture.'})}if(child&&state.session!==id)state.stack.push(saveOrigin());else if(!child){state.stack=[];state.workContext=id;}state.session=id;state.page='Conversations';state.nav=false;state.detail=null;state.panelTab='work';render();document.getElementById('transcript')?.scrollTo(0,0);document.getElementById('page-title')?.focus({preventScroll:true});announce('Opened '+agentFor(current()).name+' session: '+current().title);if(state.scenario==='archived'&&id==='builder')notify('Retained archived history opened for review; no session restored.');}
function back(){const origin=state.stack.pop();if(!origin)return;Object.assign(state,{session:origin.session,page:origin.page,panel:origin.panel,pin:origin.pin,scope:origin.scope,panelTab:origin.tab,detail:origin.detail,expanded:origin.expanded,workContext:origin.workContext});render();document.getElementById('transcript')?.scrollTo(0,origin.scroll);document.getElementById('work-scroll')?.scrollTo(0,origin.workScroll);(document.getElementById(origin.focusId)||document.querySelector(`[data-action="child"][data-session="${origin.focusSession||'builder'}"]`))?.focus({preventScroll:true});announce('Returned to '+agentFor(current()).name+'; draft and reading position restored')}
function showModal(kind,data={}){state.modalReturn=document.activeElement;state.modal={kind,...data};document.getElementById('app').inert=true;renderModal();document.querySelector('#overlay input, #overlay select, #overlay button')?.focus()}
function closeModal(){state.modal=null;document.getElementById('app').inert=false;document.getElementById('overlay').innerHTML='';if(state.modalReturn?.isConnected)state.modalReturn.focus({preventScroll:true});else document.querySelector(state.panel&&viewWidth()<1280?'.work-panel button':'[data-action="demo"]')?.focus({preventScroll:true});syncSheet()}
function modalShell(title,body,actions='',wide=false){return `<div class="backdrop" data-backdrop="true"><section class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><h2 id="modal-title">${title}</h2>${btn('close-modal',icon('close'),'icon-btn','aria-label="Close dialog"')}</div><div class="modal-body">${body}</div>${actions?'<div class="modal-actions">'+actions+'</div>':''}</section></div>`}
function renderModal(){const m=state.modal;if(!m)return;let html='';
if(m.kind==='approval'){const pending=state.approval==='pending'&&state.online;html=modalShell('Review verification action',`${pill('Synthetic approval','amber')}<p style="margin-top:15px">Reviewer requested permission to run the sample review checks.</p><dl class="detail-grid"><dt>Requester</dt><dd>Reviewer · demo-reviewer-01</dd><dt>Host</dt><dd>Demo host (fixture)</dd><dt>Workspace</dt><dd>/demo/sample-workspace</dd><dt>Request</dt><dd>approval-demo-01 · Allow once / Deny</dd><dt>State</dt><dd>${!state.online?'Disconnected · decisions unavailable':esc(state.approval)}</dd></dl><div class="code">./scripts/review-checks.sh --read-only</div><p style="margin-top:16px">This decision applies only to this exact fixture request. No command will run.</p>`,btn('resolve-approval','Deny','button','data-decision="denied" '+(!pending?'disabled':''))+btn('resolve-approval','Allow once','button primary','data-decision="allowed" '+(!pending?'disabled':'')))}
else if(m.kind==='file')html=modalShell('navigation-outline.md',`${pill('Sample artifact')}<div class="file-preview"><h3>Sample project overview</h3><p>A fictional workspace example for exploring conversations and simulated background work.</p><h3>Five destinations</h3><ul><li>Conversations — resume a thread.</li><li>Agents — find the right teammate.</li><li>Projects — group sessions and files.</li><li>Activity — follow agents, scripts and tasks.</li><li>Automations — inspect existing schedules.</li></ul><h3>Proposed change</h3><pre>+ Open delegated sessions in one click\n+ Keep background scripts visible\n+ Return to Coordinator with draft and position intact</pre></div>`,btn('close-modal','Done','button'),true);
else if(m.kind==='automation')html=modalShell('Workspace index',`${pill('Scheduled execution','green')}<dl class="detail-grid"><dt>Schedule</dt><dd>Daily at 9:00 AM · Etc/UTC</dd><dt>Current run</dt><dd>demo-index-01 · Running</dd><dt>Source</dt><dd>Existing cron fixture</dd><dt>Last run</dt><dd>Completed · Today, 9:00 AM</dd><dt>Delivery</dt><dd>Recorded separately from execution</dd></dl><div class="code">09:00 Started workspace index\n09:00 Scanned fixture file list\n09:01 Updating sample index…</div><p style="margin-top:15px">Inspection only. The prototype cannot create, trigger or disable a real schedule.</p>`,btn('close-modal','Done','button'));
else if(m.kind==='coverage')html=modalShell('What this view can observe',`<div class="stack"><p>Agent runs, supported session processes and scheduled executions can appear when their owning source exposes them.</p><div class="scenario-banner"><strong>External script · Not observed</strong><p>A script launched outside supported OpenClaw execution has no verified live status here.</p></div><p>A terminal session does not prove that a particular command is running. A missing observation never means Idle or Complete.</p></div>`,btn('close-modal','Understood','button'));
else if(m.kind==='unavailable')html=modalShell('Session unavailable',`<p>${esc(m.reason)}</p><p style="margin-top:12px">Your current conversation and draft are intact. Navigation did not start or change any work.</p>`,btn('close-modal','Stay here','button primary'));
else if(m.kind==='capability')html=modalShell(esc(m.name),`${pill('Capability preview')}<p style="margin-top:15px">${m.name==='Original OpenClaw'?'The original interface remains an independent way to access your existing environment.':'This capability will remain accessible through its supported OpenClaw view or an explicit original-interface handoff.'}</p><div class="scenario-banner"><strong>Destination preview</strong><p>Existing OpenClaw → ${esc(m.name)}<br>Target: your selected gateway · Authentication retained by the owning interface.</p></div><p>Live destinations are deliberately inactive in this offline prototype. No token, URL or connection is stored here.</p>`,btn('close-modal','Done','button'));
else if(m.kind==='connection')html=modalShell('Demo connection',`${pill(state.online?'Simulated connected':'Simulated disconnected',state.online?'green':'amber')}<p style="margin-top:15px">This prototype has no gateway endpoint or credentials. Use the connection simulation to review stale content and recovery.</p><div class="scenario-banner">Demo host · Synthetic source<br>Network access is disabled by the page’s content policy.</div>`,btn('toggle-connection',state.online?'Simulate disconnection':'Reconnect demo','button primary'));
else if(m.kind==='search'){html=`<div class="backdrop" data-backdrop="true"><section class="modal" role="dialog" aria-modal="true" aria-label="Quick Open"><label class="sr-only" for="palette">Search sessions and capabilities</label><input class="palette-search" id="palette" placeholder="Go to a session, agent, or capability…" value="${esc(state.search)}" autocomplete="off"><div class="palette-items" id="palette-items">${paletteItems()}</div><div class="modal-actions"><span class="small muted grow">↑ ↓ Navigate · Enter Open · Esc Close</span>${btn('close-modal','Close','button')}</div></section></div>`}
else if(m.kind==='demo'){const cases=[['default','Default workspace'],['parent-finished','Parent finished; script still running'],['two-sessions','Builder working in two sessions'],['unknown-run','Known session; exact run ID unavailable'],['missing-session','Missing session identity'],['replaced-session','Session replaced after observation'],['revoked','Session access revoked'],['archived','Retained archived session'],['script-failure','Script failed'],['cannot-stop','Process stop not permitted'],['expired-output','Earlier process output expired'],['worker-offline','Process worker unavailable'],['approval-expired','Approval expired'],['approval-elsewhere','Approval resolved elsewhere'],['duplicate-events','Repeated source observation'],['uncertain-send','Lost send acknowledgment']];html=modalShell('Prototype review',`<p>Explore the proposed experience with synthetic data. Changes reset when this page reloads.</p><label class="modal-label" for="scenario">Review scenario</label><select class="scenario-select" id="scenario">${cases.map(([v,l])=>`<option value="${v}" ${state.scenario===v?'selected':''}>${l}</option>`).join('')}</select><div class="review-controls">${btn('toggle-connection',state.online?'Simulate disconnect':'Reconnect demo','button')}${btn('theme','Switch appearance','button')}${btn('new','New conversation','button')}${btn('reset','Reset all demo state','button')}</div><p style="margin-top:18px">Try: write a draft to Coordinator → open Builder from Work → Back to Coordinator. Inspect verify.sh, review Reviewer’s approval, or open All work for scheduled jobs.</p><p style="margin-top:12px">Keyboard: ⌘K Quick Open · ⌘N New · ⌘B Navigation · ⌥⌘I Work · ⌘1–5 Views · Escape Back/Close.</p>`,btn('apply-scenario','Apply scenario','button primary'))}
document.getElementById('overlay').innerHTML=html;}
function paletteItems(){const q=state.search.toLowerCase();const items=[...Object.entries(sessions).map(([id,s])=>({label:agentFor(s).name+' · '+s.title,kind:'Session',id})),...['Agents','Projects','Activity','Automations'].map(x=>({label:x,kind:'View'})),...categories.map(x=>({label:x,kind:'Capability'}))].filter(x=>x.label.toLowerCase().includes(q));return items.map(x=>btn('palette-open',icon(x.kind==='Session'?'chat':'settings')+esc(x.label)+`<span>${x.kind}</span>`,'palette-item',`data-kind="${x.kind}" data-label="${esc(x.label)}" ${x.id?'data-session="'+x.id+'"':''}`)).join('')||'<div class="empty" style="min-height:100px">No matching sessions or capabilities</div>'}
function applyScenario(name){Object.values(state.stopTimers).forEach(clearTimeout);state.stopTimers={};state.scenario=name;state.parentDone=name==='parent-finished';state.extraBuilder=name==='two-sessions';state.processes={verify:name==='script-failure'?'Failed':name==='worker-offline'?'Unknown':'Running',orphan:'Running'};state.approval=name==='approval-expired'?'expired':name==='approval-elsewhere'?'resolved elsewhere':'pending';state.online=true;state.detail=null;state.panel=true;state.panelTab='work';state.session='coordinator';state.page='Conversations';state.workContext='coordinator';state.stack=[];if(['expired-output','worker-offline','cannot-stop','script-failure'].includes(name))state.detail='verify';if(name==='duplicate-events')notify('Repeated observation merged by its fixture ID; no duplicate execution.');if(name==='uncertain-send')notify('Type a message to review a lost acknowledgment.');render();announce('Applied '+name+' fixture')}
function send(){const id=state.session,text=(state.drafts[id]||'').trim();if(!text||!state.online||state.streaming)return;if(state.scenario==='archived'&&id==='builder'){notify('Archived fixture is read-only. No message sent.');return}if(state.scenario==='uncertain-send'){state.uncertain={session:id,text};state.online=false;render();announce('Submission outcome unknown');return}state.drafts[id]='';state.attachments[state.session]=false;state.sent[id]??=[];state.sent[id].push({role:'user',text});const response={role:'assistant',text:'',streaming:true,messageId:'reply-'+Date.now()};state.sent[id].push(response);state.streaming=id;render();let i=0;const words='I’ve checked the sample workspace. The agent sessions and background script are ready to inspect in Work. Here is the fixture result for your review.'.split(' ');streamTimer=setInterval(()=>{response.text+=(i?' ':'')+words[i++];const el=document.getElementById('transcript'),nearBottom=el?el.scrollHeight-el.scrollTop-el.clientHeight<100:true;const body=document.querySelector('[data-message="'+response.messageId+'"]');if(body)body.textContent=response.text;if(i===words.length){clearInterval(streamTimer);response.streaming=false;response.done=true;state.streaming=null;if(body){body.classList.remove('stream-cursor');body.insertAdjacentHTML('afterend','<details class="tool-group"><summary class="tool-summary">'+icon('check')+'<span class="grow">Checked the sample workspace</span><span>Fixture tool</span>'+icon('down')+'</summary><div class="tool-output">Read sample notes → completed<br>No files or services were changed.</div></details>'+artifactCard('Sample result','prototype-result.md · Generated from a fixture'))}const sendButton=document.querySelector('[aria-label="Send simulated message"]');if(sendButton)sendButton.disabled=!state.online||(state.scenario==='archived'&&state.session==='builder');announce('Simulated response complete')}if(nearBottom&&el)el.scrollTo(0,el.scrollHeight)},65)}
function reconnect(){state.online=true;if(state.uncertain){const u=state.uncertain;state.sent[u.session]??=[];state.sent[u.session].push({role:'user',text:u.text},{role:'assistant',text:'The fixture reconciled this message as accepted once. It was not sent again.',done:true});state.drafts[u.session]='';state.uncertain=null;notify('Reconciled: accepted once. No resend.')}render();announce('Demo reconnected; fixture observations refreshed')}
function newChat(){closeModal();const id='new-'+Object.keys(sessions).length;sessions[id]={id:'demo-'+id,key:'agent:main:'+id,agent:'main',title:'New conversation',project:'Sample workspace',isNew:true,state:'Ready'};openSession(id);document.getElementById('composer')?.focus()}
function dispatch(el){const action=el.dataset.action;switch(action){case'new':newChat();break;case'nav':state.page=el.dataset.page;state.nav=false;state.detail=null;render();document.getElementById('page-title')?.focus();break;case'session':openSession(el.dataset.session);break;case'child':openSession(el.dataset.session,true);break;case'back':back();break;case'toggle-panel':state.panel=!state.panel;render();if(state.panel&&viewWidth()<1280)document.querySelector('.work-panel button')?.focus();else if(!state.panel)document.querySelector('[data-action="toggle-panel"]')?.focus({preventScroll:true});break;case'toggle-nav':if(viewWidth()<1000)state.nav=!state.nav;else state.navHidden=!state.navHidden;render();break;case'theme':setTheme(state.theme==='dark'?'light':'dark');break;case'pin':state.pin=!state.pin;render();notify(state.pin?'Work sidebar pinned':'Work sidebar unpinned');break;case'scope':state.scope=el.dataset.scope;state.detail=null;render();break;case'tab':state.panelTab=el.dataset.tab;render();break;case'expand':state.expanded=!state.expanded;render();document.querySelector('[data-action="expand"]')?.focus();break;case'process':savedScroll=document.getElementById('work-scroll')?.scrollTop||0;state.panel=true;state.panelTab='work';state.detail=el.dataset.process;render();document.querySelector('[data-action="work-back"]')?.focus();break;case'work-back':state.detail=null;render();document.getElementById('work-scroll')?.scrollTo(0,savedScroll);document.querySelector('[data-process="verify"]')?.focus({preventScroll:true});break;case'activity':state.page='Activity';if(viewWidth()<1280)state.panel=false;render();break;case'more':state.page='More';state.nav=false;render();break;case'approval':showModal('approval');break;case'resolve-approval':if(state.online&&state.approval==='pending'){state.approval=el.dataset.decision;closeModal();render();notify('Synthetic approval '+state.approval+'. No command executed.');announce('Approval '+state.approval)}break;case'file':showModal('file');break;case'automation':showModal('automation');break;case'coverage':showModal('coverage');break;case'capability':showModal('capability',{name:el.dataset.capability});break;case'connection':showModal('connection');break;case'toggle-connection':closeModal();if(state.online){state.online=false;render();announce('Demo disconnected; data is stale')}else reconnect();break;case'reconnect':reconnect();break;case'search':state.search='';showModal('search');break;case'palette-open':{const kind=el.dataset.kind,id=el.dataset.session,label=el.dataset.label;closeModal();if(kind==='Session')openSession(id,true);else if(kind==='View'){state.page=label;render()}else showModal('capability',{name:label});break}case'demo':showModal('demo');break;case'apply-scenario':{const name=document.getElementById('scenario').value;closeModal();applyScenario(name);break}case'close-modal':closeModal();break;case'reset':location.reload();break;case'attach':state.attachments[state.session]=true;render();notify('Sample attachment added. No local file read.');break;case'remove-attachment':state.attachments[state.session]=false;render();break;case'stop-process':{const processId=state.detail;if(state.online&&state.processes[processId]==='Running'&&state.scenario!=='cannot-stop'){state.processes[processId]='Cancel requested';render();announce('Process termination requested');state.stopTimers[processId]=setTimeout(()=>{state.processes[processId]='Killed';render();announce('Fixture process exit confirmed')},1300)}break;}}
}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(el&&!el.disabled){if(el.getAttribute('type')!=='submit')e.preventDefault();dispatch(el)}else if(e.target.dataset.backdrop)closeModal()});
document.addEventListener('input',e=>{if(e.target.id==='composer')state.drafts[state.session]=e.target.value;if(e.target.id==='palette'){state.search=e.target.value;document.getElementById('palette-items').innerHTML=paletteItems()}});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='composer-form')send()});
document.addEventListener('keydown',e=>{if(e.isComposing)return;const cmd=e.metaKey||e.ctrlKey;
if(e.key==='Escape'){e.preventDefault();if(state.modal)closeModal();else if(state.detail){state.detail=null;render()}else if(state.nav){state.nav=false;render()}else if(state.panel&&viewWidth()<1280){state.panel=false;render();document.querySelector('[data-action="toggle-panel"]')?.focus()}else if(state.stack.length)back();return}
if(cmd&&e.key.toLowerCase()==='k'){e.preventDefault();state.search='';showModal('search');return}if(cmd&&e.key.toLowerCase()==='n'){e.preventDefault();newChat();return}if(cmd&&e.key.toLowerCase()==='b'){e.preventDefault();dispatch(document.querySelector('[data-action="toggle-nav"]'));return}if(cmd&&e.altKey&&e.key.toLowerCase()==='i'){e.preventDefault();state.panel=!state.panel;render();return}if(cmd&&/^[1-5]$/.test(e.key)){e.preventDefault();state.page=['Conversations','Agents','Projects','Activity','Automations'][+e.key-1];render();return}if(cmd&&e.key===','){e.preventDefault();showModal('capability',{name:'Settings'});return}
if(e.target.id==='composer'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();return}
if(!state.modal&&state.panel&&viewWidth()<1280&&e.key==='Tab'){const list=[...document.querySelectorAll('.work-panel button:not([disabled]),.work-panel a[href]')];if(list.length){if(e.shiftKey&&document.activeElement===list[0]){e.preventDefault();list.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===list.at(-1)){e.preventDefault();list[0].focus()}}}
if(state.modal){const dialog=document.querySelector('[role="dialog"]'),focusables=[...dialog.querySelectorAll('button:not([disabled]), input, select, textarea, a[href]')];if(e.key==='Tab'&&focusables.length){const first=focusables[0],last=focusables.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}if(state.modal.kind==='search'&&['ArrowDown','ArrowUp'].includes(e.key)){e.preventDefault();const list=[...document.querySelectorAll('.palette-item')],i=list.indexOf(document.activeElement);list[(i+(e.key==='ArrowDown'?1:-1)+list.length)%list.length]?.focus()}if(state.modal.kind==='search'&&e.key==='Enter'&&e.target.id==='palette'){e.preventDefault();document.querySelector('.palette-item')?.click()}}
});
let resizeTimer;addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>render(),120)});
render();
</script>
</body>
</html>
